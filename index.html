<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cono Sur Ingeniería</title>
  <meta name="description" content="Report de bombeo, estado de equipos y AST en un solo lugar.">
  <meta name="theme-color" content="#0f2a44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cono Sur">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-maskable-512.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img src="icons/logo.svg" alt="" class="brand-logo" id="brandLogo">
        <div class="brand-text">
          <strong id="brandName">Cono Sur</strong>
          <span id="brandSub">Ingeniería</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-install" id="btnInstalar" hidden>Instalar app</button>
        <button class="icon-btn" id="btnMenu" aria-label="Menú">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </div>
    </header>

    <nav class="tabs" id="tabs" role="tablist"></nav>

    <main id="main" class="main"></main>
  </div>

  <!-- Firma -->
  <div class="modal" id="modalFirma" hidden>
    <div class="modal-card firma-card">
      <div class="modal-head">
        <strong id="firmaTitulo">Firma</strong>
        <button class="icon-btn" data-cerrar aria-label="Cerrar">✕</button>
      </div>
      <div class="firma-area"><canvas id="firmaCanvas"></canvas><span class="firma-linea">Firme sobre la línea</span></div>
      <div class="modal-foot">
        <button class="btn" id="firmaLimpiar">Limpiar</button>
        <span class="spacer"></span>
        <button class="btn" data-cerrar>Cancelar</button>
        <button class="btn btn-primary" id="firmaOk">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Menú -->
  <div class="modal" id="modalMenu" hidden>
    <div class="modal-card menu-card">
      <div class="modal-head">
        <strong>Opciones</strong>
        <button class="icon-btn" data-cerrar aria-label="Cerrar">✕</button>
      </div>
      <div class="menu-list">
        <button class="menu-item" id="mRespaldo"><b>Descargar respaldo</b><span>Guarda todos los registros en un archivo</span></button>
        <label class="menu-item"><b>Restaurar respaldo</b><span>Carga un archivo de respaldo descargado antes</span><input type="file" id="mRestaurar" accept=".json,application/json" hidden></label>
        <div class="menu-info" id="mInfo"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div id="print" class="print-area"></div>

  <script src="js/formularios.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
